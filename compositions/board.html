  <div data-hf-id="hf-428t" id="root" data-composition-id="board" data-width="1920" data-height="1080">
    <div data-hf-id="hf-j16g" id="b1-header"><span data-hf-id="hf-jw7x" class="en">DEPARTURES</span><span data-hf-id="hf-nicl" class="ko">출발 안내</span></div>
    <div data-hf-id="hf-8ewg" id="b1-dest-label">목적지</div>
    <div data-hf-id="hf-kb4r" id="b1-dest" class="clip" data-start="0" data-duration="6" data-layout-allow-overflow></div>
    <div data-hf-id="hf-tlsc" id="b1-i1" class="b1-info"><div data-hf-id="hf-0jcu" class="lab">탑승객</div><div data-hf-id="hf-33cq" id="b1-r1" class="row" data-layout-allow-overflow></div></div>
    <div data-hf-id="hf-29o7" id="b1-i2" class="b1-info"><div data-hf-id="hf-n2av" class="lab">게이트</div><div data-hf-id="hf-z58p" id="b1-r2" class="row" data-layout-allow-overflow></div></div>
    <div data-hf-id="hf-ybk6" id="b1-i3" class="b1-info"><div data-hf-id="hf-7nwt" class="lab">출발</div><div data-hf-id="hf-ydkw" id="b1-r3" class="row" data-layout-allow-overflow></div></div>
    <div data-hf-id="hf-9uuk" id="b1-flood" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      // Hangul drum: every cell walks through these before landing on its target.
      var POOL = "여행출발도착비행기단풍하늘구름바다공항탑승가족오늘";

      function flapRows(rows) {
        var cells = [];
        rows.forEach(function (r, ri) {
          Array.from(r.text).forEach(function (ch, ci) {
            var cell = document.createElement("div");
            cell.className = "fl-cell";
            cell.style.width = r.w + "px";
            cell.style.height = r.h + "px";
            cell.setAttribute("data-layout-allow-overlap", "");
            cell.setAttribute("data-layout-allow-occlusion", "");
            cell.setAttribute("data-layout-allow-overflow", "");
            var faces = {};
            ["fl-top", "fl-bot", "fl-leaf-a", "fl-leaf-b"].forEach(function (cls) {
              var f = document.createElement("div");
              f.className = "fl-face " + cls;
              var g = document.createElement("span");
              g.className = "fl-glyph";
              g.style.height = r.h + "px";
              g.style.lineHeight = r.h * 1.04 + "px";
              g.style.fontSize = r.fs + "px";
              g.style.color = r.color;
              g.style.top = cls === "fl-bot" || cls === "fl-leaf-b" ? -r.h / 2 + "px" : "0px";
              f.setAttribute("data-layout-allow-occlusion", "");
              g.setAttribute("data-layout-allow-occlusion", "");
              f.appendChild(g);
              cell.appendChild(f);
              faces[cls] = f;
            });
            var seam = document.createElement("div");
            seam.className = "fl-seam";
            cell.appendChild(seam);
            r.el.appendChild(cell);
            var drum = [" "];
            var n = r.steps + (ci % 3);
            for (var k = 0; k < n - 1; k++) drum.push(POOL.charAt((ri * 31 + ci * 17 + k * 7) % POOL.length));
            drum.push(ch);
            cells.push({ drum: drum, t0: r.t0 + ci * r.stagger, flip: r.flip, f: faces });
          });
        });

        function leaf(face, ch, ang, shade) {
          face.firstChild.textContent = ch;
          face.style.opacity = "1";
          face.style.transform = "rotateX(" + ang.toFixed(2) + "deg)";
          face.style.filter = "brightness(" + shade + ")";
        }
        function clear(face) {
          face.style.opacity = "0";
          face.style.transform = "";
          face.style.filter = "";
          face.firstChild.textContent = "";
        }
        return function paint(t) {
          cells.forEach(function (c) {
            var steps = c.drum.length - 1;
            var raw = t <= c.t0 ? 0 : (t - c.t0) / c.flip;
            var count = Math.floor(raw);
            var p = raw - count;
            if (count >= steps) { count = steps; p = 0; }
            var out = c.drum[count];
            var inc = c.drum[Math.min(count + 1, steps)];
            if (!(count < steps && p > 0)) {
              c.f["fl-top"].firstChild.textContent = out;
              c.f["fl-bot"].firstChild.textContent = out;
              clear(c.f["fl-leaf-a"]);
              clear(c.f["fl-leaf-b"]);
              return;
            }
            c.f["fl-top"].firstChild.textContent = inc;
            c.f["fl-bot"].firstChild.textContent = out;
            var theta = 180 * p * p;
            var shade = (1 - 0.5 * Math.sin((theta * Math.PI) / 180)).toFixed(3);
            if (theta < 90) {
              leaf(c.f["fl-leaf-a"], out, -theta, shade);
              clear(c.f["fl-leaf-b"]);
            } else {
              clear(c.f["fl-leaf-a"]);
              leaf(c.f["fl-leaf-b"], inc, 180 - theta, shade);
            }
          });
        };
      }

      var paint = flapRows([
        { el: document.getElementById("b1-dest"), text: "가을", t0: 0.3, flip: 0.075, steps: 12, stagger: 0.12, w: 420, h: 560, fs: 400, color: "#F5C518" },
        { el: document.getElementById("b1-r1"), text: "가족4명", t0: 1.8, flip: 0.07, steps: 6, stagger: 0.08, w: 104, h: 148, fs: 100, color: "#F4EFE2" },
        { el: document.getElementById("b1-r2"), text: "10월", t0: 2.6, flip: 0.07, steps: 6, stagger: 0.08, w: 104, h: 148, fs: 100, color: "#F4EFE2" },
        { el: document.getElementById("b1-r3"), text: "지금", t0: 3.4, flip: 0.07, steps: 6, stagger: 0.08, w: 104, h: 148, fs: 100, color: "#F5C518" },
      ]);

      var clock = 0;
      var driver = {};
      Object.defineProperty(driver, "t", {
        get: function () { return clock; },
        set: function (v) { clock = v; paint(v); },
      });

      var tl = gsap.timeline({ paused: true });
      tl.to(driver, { t: 6, duration: 6, ease: "none" }, 0);
      // A full-frame orange flap falls from the top hinge and becomes the next scene's ground.
      tl.set("#b1-flood", { opacity: 1 }, 5.45);
      tl.fromTo("#b1-flood", { rotationX: -90 }, { rotationX: 0, duration: 0.45, ease: "power3.in" }, 5.45);
      paint(0);
      window.__timelines["board"] = tl;
    })();
  </script>
